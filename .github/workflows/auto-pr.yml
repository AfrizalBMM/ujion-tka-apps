name: Auto Merge Develop to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"

      - name: Check for differences between develop and main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          ahead=$(gh api "repos/$repo/compare/main...develop" --jq ".ahead_by")
          if [ -z "$ahead" ] || [ "$ahead" = "0" ]; then
            echo "Tidak ada perubahan baru antara develop dan main. Melewati proses."
            echo "HAS_DIFF=false" >> "$GITHUB_ENV"
          else
            echo "Ditemukan $ahead commit baru di develop."
            echo "HAS_DIFF=true" >> "$GITHUB_ENV"
          fi

      - name: Create or find pull request
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          existingPr=$(gh pr list \
            --repo "$repo" \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq ".[0].number")
          if [ -n "$existingPr" ]; then
            echo "Pull Request sudah ada: #$existingPr"
            echo "PR_NUMBER=$existingPr" >> "$GITHUB_ENV"
          else
            echo "Membuat Pull Request baru..."
            prUrl=$(gh pr create \
              --repo "$repo" \
              --base main \
              --head develop \
              --title "Auto Merge: develop -> main" \
              --body "Pull Request ini dibuat otomatis oleh GitHub Actions setelah perubahan masuk ke branch develop.")
            prNumber=$(echo "$prUrl" | grep -oP '\d+')
            echo "Pull Request dibuat: #$prNumber"
            echo "PR_NUMBER=$prNumber" >> "$GITHUB_ENV"
          fi

      - name: Check mergeable status
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          pr="${{ env.PR_NUMBER }}"
          echo "Mengecek status mergeable PR #$pr ..."
          mergeable="UNKNOWN"
          attempt=0
          while [ "$mergeable" = "UNKNOWN" ] && [ "$attempt" -lt 5 ]; do
            sleep 3
            mergeable=$(gh pr view "$pr" --repo "$repo" --json mergeable --jq ".mergeable")
            echo "Percobaan $((attempt + 1)): status = $mergeable"
            attempt=$((attempt + 1))
          done
          if [ "$mergeable" = "CONFLICTING" ]; then
            echo "::error::PR #$pr memiliki conflict dan tidak bisa di-merge otomatis."
            gh pr comment "$pr" \
              --repo "$repo" \
              --body "Auto-merge gagal: branch develop memiliki conflict dengan main. Mohon di-resolve manual."
            exit 1
          fi

      - name: Tunggu CI hijau sebelum merge
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          pr="${{ env.PR_NUMBER }}"
          sha=$(gh pr view "$pr" --repo "$repo" --json headRefOid --jq '.headRefOid')
          echo "PR head SHA: $sha"
          reason=""
          if ! echo "$sha" | grep -qP '^[0-9a-f]{40}$'; then
            reason="gagal mendapat sha PR"
          else
            runStatus="null"
            for i in $(seq 1 60); do
              runStatus=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0].status')
              echo "iter=$i status=$runStatus"
              if [ "$runStatus" = "completed" ]; then break; fi
              sleep 15
            done
            if [ "$runStatus" != "completed" ]; then
              reason="timeout 15 menit menunggu CI"
            else
              runConclusion=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0].conclusion')
              echo "conclusion=$runConclusion"
              if [ "$runConclusion" != "success" ]; then
                reason="CI berstatus '$runConclusion'"
              fi
            fi
          fi
          if [ -n "$reason" ]; then
            gh pr edit "$pr" --repo "$repo" --body "Auto-merge dibatalkan: $reason. Detail: https://github.com/$repo/actions"
            gh pr comment "$pr" --repo "$repo" --body "Auto-merge dibatalkan: $reason."
            exit 1
          fi
          echo "CI hijau, siap merge."

      - name: Merge pull request
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          pr="${{ env.PR_NUMBER }}"
          echo "Merging PR #$pr ..."
          gh pr merge "$pr" \
            --repo "$repo" \
            --squash

      - name: Trigger deploy workflow
        if: env.HAS_DIFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          echo "Menjalankan deploy.yml..."
          gh workflow run deploy.yml \
            --repo "$repo" \
            --ref main
          echo "Deploy workflow berhasil dipanggil."
