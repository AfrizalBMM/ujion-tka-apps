name: Auto Merge Develop to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  auto-merge:
    runs-on: self-hosted

    steps:
      - name: Check GitHub CLI
        shell: powershell
        run: |
          gh --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Fix git safe directory
        shell: powershell
        run: |
          git config --global --add safe.directory "${{ github.workspace }}"

      - name: Check for differences between develop and main
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"

          $ahead = gh api "repos/$repo/compare/main...develop" --jq ".ahead_by" 2>$null

          if (-not $ahead -or $ahead -eq "0") {
              Write-Host "Tidak ada perubahan baru antara develop dan main. Melewati proses."
              "HAS_DIFF=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
              Write-Host "Ditemukan $ahead commit baru di develop."
              "HAS_DIFF=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Create or find pull request
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"

          Write-Host "Repository: $repo"

          $existingPr = gh pr list `
            --repo $repo `
            --base main `
            --head develop `
            --state open `
            --json number `
            --jq ".[0].number"

          if ($existingPr) {
              Write-Host "Pull Request sudah ada: #$existingPr"
              "PR_NUMBER=$existingPr" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
              Write-Host "Membuat Pull Request baru..."

              $prNumber = gh pr create `
                --repo $repo `
                --base main `
                --head develop `
                --title "Auto Merge: develop -> main" `
                --body "Pull Request ini dibuat otomatis oleh GitHub Actions setelah perubahan masuk ke branch develop."

              Write-Host "Pull Request dibuat: $prNumber"

              $number = $prNumber -replace '\D',''

              "PR_NUMBER=$number" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Check mergeable status
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $pr = "${{ env.PR_NUMBER }}"

          Write-Host "Mengecek status mergeable PR #$pr ..."

          $mergeable = "UNKNOWN"
          $attempt = 0

          while ($mergeable -eq "UNKNOWN" -and $attempt -lt 5) {
              Start-Sleep -Seconds 3
              $mergeable = gh pr view $pr --repo $repo --json mergeable --jq ".mergeable"
              Write-Host "Percobaan $($attempt + 1): status = $mergeable"
              $attempt++
          }

          if ($mergeable -eq "CONFLICTING") {
              Write-Host "::error::PR #$pr memiliki conflict dan tidak bisa di-merge otomatis."

              gh pr comment $pr `
                --repo $repo `
                --body "Auto-merge gagal: branch develop memiliki conflict dengan main. Mohon di-resolve manual (lewat GitHub web atau lokal), lalu push ulang ke develop."

              exit 1
          }

      - name: Tunggu CI hijau sebelum merge
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $repo = "${{ github.repository }}"
          $pr = "${{ env.PR_NUMBER }}"
          $dbg = @()
          $reason = ""

          $sha = "$(gh pr view $pr --repo $repo --json headRefOid --jq '.headRefOid' 2>&1)".Trim()
          $dbg += "gh pr view exit=$LASTEXITCODE sha=$sha"

          if ($sha -notmatch '^[0-9a-f]{40}$') {
              $reason = "gagal mendapat sha PR"
          }
          else {
              $runStatus = "none"
              for ($i = 0; $i -lt 60; $i++) {
                  $runStatus = "$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0].status // "none"' 2>&1)".Trim()
                  if ($runStatus -eq "completed") { break }
                  Start-Sleep -Seconds 15
              }
              $dbg += "status akhir=$runStatus"

              if ($runStatus -ne "completed") {
                  $reason = "timeout 15 menit menunggu CI"
              }
              else {
                  $runConclusion = "$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0].conclusion' 2>&1)".Trim()
                  $dbg += "conclusion=$runConclusion exit=$LASTEXITCODE"
                  if ($runConclusion -ne "success") { $reason = "CI berstatus '$runConclusion'" }
              }
          }

          if ($reason -ne "") {
              $body = "Auto-merge dibatalkan: $reason. Detail: https://github.com/$repo/actions`n`nDebug gate:`n" + ($dbg -join "`n")
              gh pr edit $pr --repo $repo --body $body 2>&1 | Out-Host
              Write-Host "exit pr edit=$LASTEXITCODE"
              gh pr comment $pr --repo $repo --body "Auto-merge dibatalkan: $reason (log di deskripsi PR)." 2>&1 | Out-Host
              Write-Host "exit pr comment=$LASTEXITCODE"
              exit 1
          }

          Write-Host "CI hijau — lanjut merge."
          $dbg | ForEach-Object { Write-Host $_ }

      - name: Merge pull request
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $pr = "${{ env.PR_NUMBER }}"

          Write-Host "Merging PR #$pr ..."

          gh pr merge $pr `
            --repo $repo `
            --squash

      - name: Sync develop with main
        if: env.HAS_DIFF == 'true'
        shell: powershell
        run: |
          Write-Host "Menyamakan branch develop dengan main..."

          git fetch origin
          git checkout develop
          git reset --hard origin/main
          git push --force origin develop

          Write-Host "Branch develop sudah disamakan dengan main."

      - name: Trigger deploy workflow
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"

          Write-Host "Menjalankan deploy.yml..."

          gh workflow run deploy.yml `
            --repo $repo `
            --ref main

          Write-Host "Deploy workflow berhasil dipanggil."
