name: Auto Merge Develop to Main

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    runs-on: self-hosted

    steps:
      - name: Cek GitHub CLI
        shell: powershell
        run: |
          gh --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Cek perbedaan develop vs main
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"

          $ahead = gh api "repos/$repo/compare/main...develop" --jq ".ahead_by" 2>$null

          if (-not $ahead -or $ahead -eq "0") {
              Write-Host "Tidak ada perubahan baru antara develop dan main. Melewati proses."
              "HAS_DIFF=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
              Write-Host "Ditemukan $ahead commit baru di develop."
              "HAS_DIFF=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Buat atau cari Pull Request
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"

          Write-Host "Repository: $repo"

          $existingPr = gh pr list `
            --repo $repo `
            --base main `
            --head develop `
            --state open `
            --json number `
            --jq ".[0].number"

          if ($existingPr) {
              Write-Host "Pull Request sudah ada: #$existingPr"
              "PR_NUMBER=$existingPr" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          else {
              Write-Host "Membuat Pull Request baru..."

              $prNumber = gh pr create `
                --repo $repo `
                --base main `
                --head develop `
                --title "Auto Merge: develop → main" `
                --body "Pull Request ini dibuat otomatis oleh GitHub Actions setelah perubahan masuk ke branch develop."

              Write-Host "Pull Request dibuat: $prNumber"

              $number = $prNumber -replace '\D',''

              "PR_NUMBER=$number" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Cek status mergeable
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $pr = "${{ env.PR_NUMBER }}"

          Write-Host "Mengecek status mergeable PR #$pr ..."

          $mergeable = "UNKNOWN"
          $attempt = 0

          while ($mergeable -eq "UNKNOWN" -and $attempt -lt 5) {
              Start-Sleep -Seconds 3
              $mergeable = gh pr view $pr --repo $repo --json mergeable --jq ".mergeable"
              Write-Host "Percobaan $($attempt + 1): status = $mergeable"
              $attempt++
          }

          if ($mergeable -eq "CONFLICTING") {
              Write-Host "::error::PR #$pr memiliki conflict dan tidak bisa di-merge otomatis."

              gh pr comment $pr `
                --repo $repo `
                --body "⚠️ Auto-merge gagal: branch develop memiliki conflict dengan main. Mohon di-resolve manual (lewat GitHub web atau lokal), lalu push ulang ke develop."

              exit 1
          }

      - name: Merge Pull Request
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "${{ github.repository }}"
          $pr = "${{ env.PR_NUMBER }}"

          Write-Host "Merging PR #$pr ..."

          gh pr merge $pr `
            --repo $repo `
            --squash `
            --admin `
            --delete-branch

      - name: Buat ulang branch develop dari main
        if: env.HAS_DIFF == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Write-Host "Menyiapkan ulang branch develop dari main..."

          git config --global --add safe.directory "D:/actions-runner/_work/ujion-tka-apps/ujion-tka-apps"
          git fetch origin

          git checkout main
          git pull origin main

          git branch -D develop 2>$null
          $LASTEXITCODE = 0

          git push origin --delete develop 2>$null
          $LASTEXITCODE = 0

          git checkout -b develop
          git push -u origin develop

          Write-Host "Branch develop berhasil dibuat ulang dari main."
