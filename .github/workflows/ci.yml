name: CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  checks:
    name: Pint & PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, tokenizer, xml, curl, zip, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: cp .env.example .env && php artisan key:generate --force

      - name: Pint (gaya kode)
        run: vendor/bin/pint --test

      - name: Install dependensi JS
        run: npm ci --no-audit --no-fund

      - name: Build aset
        run: npm run build

      - name: PHPUnit
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.txt

      - name: Ungkap kegagalan ke anotasi & ringkasan
        if: failure()
        shell: bash
        run: |
          if [ -f test-output.txt ]; then
            {
              echo '### Detail kegagalan PHPUnit'
              echo '```'
              tail -120 test-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            awk '/FAILED|⨯/{p=1;c=0} p&&c<8{print;c++} /^$/{if(p&&c>0){p=0}}' test-output.txt \
              | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          else
            echo "::error::test-output.txt tidak ada (gagal sebelum PHPUnit)"
          fi
