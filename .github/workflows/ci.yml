name: CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Pint & PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, tokenizer, xml, curl, zip, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: cp .env.example .env && php artisan key:generate --force

      - name: Pint (gaya kode)
        run: vendor/bin/pint --test

      - name: Install dependensi JS
        run: npm ci --no-audit --no-fund

      - name: Build aset
        run: npm run build

      - name: PHPUnit
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.txt

      - name: Simpan log kegagalan ke branch ci-log
        if: failure()
        shell: bash
        run: |
          {
            echo "run   : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "sha   : $GITHUB_SHA"
            echo "waktu : $(date -u +%FT%TZ)"
            echo "-------------------------"
            if [ -f test-output.txt ]; then
              tail -250 test-output.txt
            else
              echo "test-output.txt tidak ada (gagal sebelum langkah PHPUnit)"
            fi
          } > ci-failure.log
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B ci-log
          git add -f ci-failure.log
          git commit --allow-empty -m "Log kegagalan CI otomatis"
          git push origin ci-log --force
