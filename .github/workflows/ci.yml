name: CI

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Pint & PHPUnit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, tokenizer, xml, curl, zip, gd, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: cp .env.example .env && php artisan key:generate --force

      - name: Pint (gaya kode)
        run: vendor/bin/pint --test

      - name: Install dependensi JS
        run: npm ci --no-audit --no-fund

      - name: Build aset
        run: npm run build

      - name: PHPUnit
        shell: bash
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee test-output.txt

      - name: Simpan log kegagalan sebagai artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-log
          path: |
            test-output.txt
            ci-failure.log
          if-no-files-found: ignore
          retention-days: 14
