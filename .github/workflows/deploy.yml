name: Deploy Ujion Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH to Rumah Web hosting
        uses: appleboy/ssh-action@v1
        with:
          host: 202.10.43.99
          port: 2223
          username: redp7931
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          script: |
            cd ~/public_html/tka-ujion.reditech.id

            echo "=== Git fetch + reset to origin/main ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Composer install (no-dev, optimize) ==="
            php ~/composer.phar install --no-dev --optimize-autoloader --no-interaction 2>&1 || echo "WARN: composer install issue"

            echo "=== Run migrations ==="
            php artisan migrate --force

            echo "=== Clear + cache ==="
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Done ==="
            php artisan tinker --execute="echo 'App: ' . config('app.name') . ' | Env: ' . config('app.env');" 2>&1 || true
