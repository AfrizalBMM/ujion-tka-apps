name: Deploy Ujion Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH to Rumah Web hosting
        uses: appleboy/ssh-action@v1
        with:
          host: 202.10.43.99
          port: 2223
          username: redp7931
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          script_stop: false
          allenvs: false
          command_timeout: 8m
          proxy_timeout: 8m
          script: |
            export LC_ALL=C
            cd ~/public_html/tka-ujion.reditech.id
            echo "=== Git fetch + reset ==="
            git fetch origin main 2>&1
            git reset --hard origin/main 2>&1
            echo "=== Composer ==="
            php ~/composer.phar install --no-dev --optimize-autoloader --no-interaction 2>&1 || true
            echo "=== Migrate ==="
            php artisan migrate --force 2>&1 || true
            echo "=== Cache ==="
            php artisan optimize:clear 2>&1 || true
            php artisan config:cache 2>&1 || true
            php artisan route:cache 2>&1 || true
            php artisan view:cache 2>&1 || true
            echo "=== Done ==="
