name: Deploy Ujion Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Deploy via SSH to Rumah Web hosting
        uses: appleboy/ssh-action@v1
        with:
          host: 202.10.43.99
          port: 2223
          username: redp7931
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          script_stop: false
          allenvs: false
          command_timeout: 8m
          proxy_timeout: 8m
          script: |
            export LC_ALL=C
            cd ~/public_html/tka-ujion.reditech.id
            echo "=== Git fetch + reset ==="
            git fetch origin main 2>&1
            git reset --hard origin/main 2>&1
            echo "=== Composer ==="
            php ~/composer.phar install --no-dev --optimize-autoloader --no-interaction 2>&1 || true
            echo "=== Migrate ==="
            php artisan migrate --force 2>&1 || true
            echo "=== Ziggy routes ==="
            php artisan ziggy:generate 2>&1 || true
            echo "=== Cache ==="
            php artisan optimize:clear 2>&1 || true
            php artisan config:cache 2>&1 || true
            php artisan route:cache 2>&1 || true
            php artisan view:cache 2>&1 || true
            echo "=== Done ==="
            php artisan tinker --execute="echo 'App: ' . config('app.name') . ' | Env: ' . config('app.env');" 2>&1 || true

      - name: Upload build assets to hosting (after git reset)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 202.10.43.99
          port: 2223
          username: redp7931
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          source: "public/build/"
          target: "/home/redp7931/public_html/tka-ujion.reditech.id/public/"
          strip_components: 1
          timeout: 120s
          command_timeout: 120s

      - name: Clear cache after asset upload
        uses: appleboy/ssh-action@v1
        with:
          host: 202.10.43.99
          port: 2223
          username: redp7931
          key: ${{ secrets.RUMAHWEB_SSH_KEY }}
          script_stop: false
          allenvs: false
          command_timeout: 4m
          proxy_timeout: 4m
          script: |
            export LC_ALL=C
            cd ~/public_html/tka-ujion.reditech.id
            php artisan optimize:clear 2>&1 || true
            php artisan config:cache 2>&1 || true
            php artisan route:cache 2>&1 || true
            php artisan view:cache 2>&1 || true
            echo "=== Deploy complete ==="
