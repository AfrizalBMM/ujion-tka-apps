name: Deploy Ujion Laravel

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sync repository to server
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          Set-Location "D:\laragon\www\ujion-tka-apps"

          Write-Host "=== Repository ==="
          git remote -v

          Write-Host "=== Fetch repository ==="
          git -c credential.helper= -c core.askPass= -c "http.extraheader=AUTHORIZATION: bearer $env:GH_TOKEN" fetch --prune origin main

          Write-Host "=== Checkout main ==="
          git checkout main

          Write-Host "=== Reset ke origin/main ==="
          git reset --hard origin/main

          Write-Host "=== Git status ==="
          git status

      - name: Build Laravel application
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: 0
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location "D:\laragon\www\ujion-tka-apps"

          Write-Host "=== Docker Compose Build ==="
          docker compose build app queue 2>&1 | Tee-Object -FilePath build-log.txt
          $buildExit = $LASTEXITCODE
          Write-Host "build exit=$buildExit"

          if ($buildExit -ne 0) {
              Write-Host "Build gagal — mengunggah log ke branch deploy-log ..."
              git config user.name github-actions
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add -f build-log.txt
              git commit -m "Log build deploy gagal otomatis" -- build-log.txt 2>&1 | Out-Host
              Write-Host "commit exit=$LASTEXITCODE"
              git -c credential.helper= -c core.askPass= -c "http.extraheader=AUTHORIZATION: bearer $env:GH_TOKEN" push --force origin HEAD:refs/heads/deploy-log 2>&1 | Out-Host
              Write-Host "push exit=$LASTEXITCODE"
              git reset --hard origin/main 2>&1 | Out-Host
              exit $buildExit
          }

      - name: Recreate application containers
        shell: powershell
        run: |
          Set-Location "D:\laragon\www\ujion-tka-apps"

          Write-Host "=== Recreating containers with new image ==="
          docker compose up -d --force-recreate --remove-orphans app queue webserver

      - name: Wait for database
        shell: powershell
        run: |
          Write-Host "Menunggu database..."
          Start-Sleep -Seconds 10

      - name: Run migrations
        shell: powershell
        run: |
          Set-Location "D:\laragon\www\ujion-tka-apps"

          Write-Host "=== Running migration ==="
          docker compose exec -T app php artisan migrate --force

      - name: Clear and cache Laravel config
        shell: powershell
        run: |
          Set-Location "D:\laragon\www\ujion-tka-apps"

          Write-Host "=== Clearing Laravel cache ==="
          docker compose exec -T app php artisan optimize:clear

          Write-Host "=== Caching Laravel config ==="
          docker compose exec -T app php artisan config:cache

      - name: Check container status
        shell: powershell
        run: |
          Set-Location "D:\laragon\www\ujion-tka-apps"

          Write-Host "=== Container Status ==="
          docker compose ps
